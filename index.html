<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTPHub - 50 Countries</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="toasts"></div>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="logo">OTPHub.</div>
      <p class="auth-sub">50 Countries • Local currency</p>
      <div class="tabs">
        <button type="button" id="tabLogin" class="tab active">Login</button>
        <button type="button" id="tabRegister" class="tab">Create Account</button>
      </div>
      <form id="loginForm"><input id="loginEmail" type="email" class="input" placeholder="Email" required /><input id="loginPass" type="password" class="input" placeholder="Password" required /><button type="submit" class="auth-btn">Login</button></form>
      <form id="registerForm" class="hidden"><input id="regEmail" type="email" class="input" placeholder="Email" required /><input id="regPass" type="password" class="input" placeholder="Password min 6" required /><input id="regPass2" type="password" class="input" placeholder="Confirm" required /><button type="submit" class="auth-btn">Create Account</button></form>
    </div>
  </div>
  <div id="app" class="hidden">
    <header class="header">
      <div class="logo">OTPHub.</div>
      <div class="header-right"><span id="userEmail"></span><button id="walletBtn" class="wallet"><span id="walletBalance">₦0</span></button><button id="logoutBtn" class="logout">Logout</button></div>
    </header>
    <main>
      <section class="hero">
        <div id="localBadge" class="local-badge">📍 Detecting location...</div>
        <h1>Buy OTP for <span id="heroPrice">₦1,000</span></h1>
        <p id="heroSub">50 countries available - search USA, UK, Canada...</p>
        <div class="deposit-bar">
          <button id="depositBtn" class="deposit-btn">💳 Deposit / Fund Wallet</button>
        </div>
      </section>
      <div class="search-box"><input id="phoneSearch" type="text" placeholder="Search 50 countries: USA, UK, Canada..." /></div>
      <div id="phoneCountryRow" class="country-row"></div>
      <section id="activeOrder" class="active-card hidden"><div class="active-head"><span id="orderService"></span><span id="timer">15:00</span></div><div class="timer-bar"><div id="timerProgress"></div></div><div id="phoneNumber" class="phone"></div><div id="orderStatus" class="status"></div><div id="otpBox" class="otp-box hidden"><div><div class="otp-label">OTP CODE</div><strong id="otpCode"></strong></div><span class="copy-pill">COPY</span></div><div id="waitingText" class="waiting"><span class="dot"></span> Waiting for SMS...</div></section>
      <h2 id="servicesTitle">Services</h2>
      <section id="services"></section>
    </main>
    <!-- UPDATED PAYSTACK MODAL -->
    <div id="topupModal" class="modal hidden">
      <div class="modal-content"><div class="handle"></div><h3>💳 Deposit with Paystack</h3><p class="current">Balance: <strong id="modalBalance">₦0</strong> • <span id="modalCountry"></span></p>
        <div style="margin:15px 0;">
          <input id="payEmail" type="email" class="input" placeholder="Confirm your email" style="width:100%; margin-bottom:12px;" />
          <p style="font-size:13px; opacity:0.7; margin-bottom:10px;">Choose amount to fund:</p>
          <div id="topupOptions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button onclick="payNow(500)" class="auth-btn" style="padding:12px;">₦500</button>
            <button onclick="payNow(1000)" class="auth-btn" style="padding:12px;">₦1,000</button>
            <button onclick="payNow(2000)" class="auth-btn" style="padding:12px;">₦2,000</button>
            <button onclick="payNow(5000)" class="auth-btn" style="padding:12px; background:#00C896;">₦5,000</button>
          </div>
          <p id="payStatus" style="margin-top:12px; font-size:13px; text-align:center;"></p>
        </div>
      <button id="closeModalBtn" class="close-btn">Close</button></div>
    </div>
  </div>
  <script src="index.js"></script>
  <!-- PAYSTACK SCRIPT - ADDED -->
  <script>
    // Auto-fill email when modal opens
    document.getElementById('depositBtn')?.addEventListener('click', () => {
      const loggedEmail = document.getElementById('userEmail')?.textContent || '';
      const payEmailInput = document.getElementById('payEmail');
      if(payEmailInput && loggedEmail && loggedEmail.includes('@')){
        payEmailInput.value = loggedEmail.trim();
      }
    });

    async function payNow(amount){
      const emailInput = document.getElementById('payEmail');
      const status = document.getElementById('payStatus');
      const email = emailInput.value.trim() || document.getElementById('userEmail')?.textContent?.trim();
      
      if(!email || !email.includes('@')){
        alert("Please enter valid email");
        return;
      }
      
      status.textContent = "⏳ Redirecting to Paystack...";
      try{
        const res = await fetch('https://otp-backend-amwc.onrender.com/api/pay/initialize', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, amount: Number(amount) })
        });
        const data = await res.json();
        if(data.status && data.data.authorization_url){
          window.location.href = data.data.authorization_url;
        } else {
          status.textContent = "❌ Error: " + (data.message || JSON.stringify(data));
          console.log(data);
        }
      } catch(e){
        status.textContent = "❌ Network error: " + e.message;
      }
    }
  </script>
</body>
</html>
