 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTPHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toasts"></div>

  <header class="header">
    <div class="logo">OTPHub.</div>
    <button id="walletBtn" class="wallet"><span id="walletBalance">₦0</span> • Top up</button>
  </header>

  <main>
    <section class="hero">
      <h1>Buy OTP for <span id="heroPrice">₦1,000</span></h1>
      <p id="heroSub"></p>
    </section>

    <div id="countryRow" class="country-row"></div>

    <section id="activeOrder" class="active-card hidden">
      <div class="active-head">
        <span id="orderService"></span>
        <span id="timer">15:00</span>
      </div>
      <div class="timer-bar"><div id="timerProgress"></div></div>
      <div id="phoneNumber" class="phone"></div>
      <div id="orderStatus" class="status"></div>

      <div id="otpBox" class="otp-box hidden">
        <div>
          <div class="otp-label">OTP CODE</div>
          <strong id="otpCode"></strong>
        </div>
        <span class="copy-pill">TAP TO COPY</span>
      </div>

      <div id="waitingText" class="waiting"><span class="dot"></span> Waiting for SMS... checking every 3s</div>
      <button id="cancelOrderBtn" class="cancel-btn">Cancel Number</button>
    </section>

    <h2 id="servicesTitle"></h2>
    <section id="services"></section>
  </main>

  <div id="topupModal" class="modal hidden">
    <div class="modal-content">
      <div class="handle"></div>
      <h3>Fund Wallet <span id="modalCountry"></span></h3>
      <p class="current">Current: <strong id="modalBalance"></strong></p>
      <div id="topupOptions"></div>
      <button id="closeModalBtn" class="close-btn">Close</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
