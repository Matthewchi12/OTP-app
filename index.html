<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OTPHub</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0a0a0a;
  color:#fff;
  font-family:system-ui,sans-serif;
}

.hidden{
  display:none !important;
}

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  padding:20px;
}

.auth-card{
  background:#111;
  border:1px solid #222;
  padding:24px;
  border-radius:16px;
  width:100%;
  max-width:380px;
}

.input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  background:#000;
  color:#fff;
  border:1px solid #333;
  outline:none;
}

.tab{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  font-weight:700;
  cursor:pointer;
}

.services-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:12px;
}

.service-card{
  background:#151515;
  border:1px solid #252525;
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.service-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.service-logo{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:10px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #222;
  overflow:hidden;
}

.service-logo img{
  width:26px;
  height:26px;
  object-fit:contain;
}

.service-name{
  font-weight:700;
  font-size:13px;
}

.service-meta{
  font-size:11px;
  color:#888;
  margin-top:2px;
}

.buy-btn{
  background:#00C896;
  color:#000;
  border:none;
  padding:7px 14px;
  border-radius:20px;
  font-weight:800;
  font-size:11px;
  cursor:pointer;
  flex-shrink:0;
}

.country-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  scrollbar-width:none;
}

.country-row::-webkit-scrollbar{
  display:none;
}

.country-chip{
  white-space:nowrap;
  background:#151515;
  border:1px solid #252525;
  padding:7px 14px;
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
}

.country-chip.active{
  background:#00C896;
  color:#000;
  font-weight:700;
}

.search-box{
  padding:0 12px;
  margin:10px 0;
}

.search-box input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  background:#151515;
  border:1px solid #252525;
  color:#fff;
  outline:none;
}

.active-card{
  margin:12px;
  background:#151515;
  border:1px solid #252525;
  border-radius:14px;
  padding:14px;
}

@media(max-width:480px){

  .services-grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:8px;
  }

  .service-card{
    padding:10px;
  }

  .service-logo{
    width:36px;
    height:36px;
  }

  .service-logo img{
    width:23px;
    height:23px;
  }

  .service-name{
    font-size:12px;
  }

  .buy-btn{
    padding:6px 10px;
    font-size:10px;
  }
}
</style>
</head>

<body>


<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth-screen">

  <div class="auth-card">

    <div style="color:#00C896;font-weight:900;font-size:28px">
      OTPHub.
    </div>

    <p style="color:#888;margin:8px 0 20px;font-size:13px">
      50 Countries • Instant OTP
    </p>

    <div style="display:flex;gap:8px;margin-bottom:16px">

      <button
        id="tabLogin"
        class="tab"
        style="background:#00C896;color:#000">
        Login
      </button>

      <button
        id="tabRegister"
        class="tab"
        style="background:#222;color:#fff">
        Create Account
      </button>

    </div>


    <!-- LOGIN -->

    <form id="loginForm">

      <input
        id="loginEmail"
        type="email"
        class="input"
        placeholder="Email"
        required/>

      <input
        id="loginPass"
        type="password"
        class="input"
        placeholder="Password"
        required/>

      <button
        type="submit"
        style="width:100%;padding:14px;background:#00C896;color:#000;border:none;border-radius:10px;font-weight:900;margin-top:8px">

        Login

      </button>

      <p style="text-align:center;margin-top:12px">

        <button
          type="button"
          id="forgotBtn"
          style="background:none;border:none;color:#00C896;font-size:13px;cursor:pointer;text-decoration:underline">

          Forgot Password?

        </button>

      </p>

    </form>


    <!-- REGISTER -->

    <form
      id="registerForm"
      class="hidden">

      <input
        id="regEmail"
        type="email"
        class="input"
        placeholder="Email"
        required/>

      <input
        id="regPass"
        type="password"
        class="input"
        placeholder="Password min 6"
        required/>

      <input
        id="regPass2"
        type="password"
        class="input"
        placeholder="Confirm"
        required/>

      <button
        type="submit"
        style="width:100%;padding:14px;background:#00C896;color:#000;border:none;border-radius:10px;font-weight:900;margin-top:8px">

        Create Account

      </button>

    </form>

  </div>

</div>



<!-- ================= APP ================= -->

<div id="app" class="hidden">


<header
style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #222">

  <div
    style="color:#00C896;font-weight:900;font-size:22px">

    OTPHub.

  </div>


  <div
    style="display:flex;gap:8px;align-items:center;min-width:0">

    <span
      id="userEmail"
      style="font-size:11px;color:#888;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
    </span>


    <button
      id="walletBtn"
      style="background:#00C896;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:800">

      ₦0

    </button>


    <button
      id="logoutBtn"
      style="background:#222;color:#fff;border:none;padding:8px 12px;border-radius:20px;font-size:12px">

      Logout

    </button>

  </div>

</header>



<main>


<!-- ================= HOME ================= -->

<section style="padding:20px 12px">

  <div
    style="background:#151515;border:1px solid #222;padding:6px 12px;border-radius:20px;display:inline-block;font-size:11px;margin-bottom:12px">

    📍 Nigeria • ₦1,000 per OTP

  </div>


  <h1 style="font-size:28px;margin:0">

    Buy OTP for
    <span style="color:#00C896">
      ₦1,000
    </span>

  </h1>


  <p
    style="color:#888;font-size:13px;margin-top:6px">

    50 countries • WhatsApp, Telegram & more

  </p>


  <button
    id="depositBtn"
    style="width:100%;padding:16px;background:#00C896;color:#000;border:none;border-radius:12px;font-weight:900;font-size:15px;margin-top:14px">

    💳 Deposit / Fund Wallet

  </button>

</section>



<!-- ================= SEARCH ================= -->

<div class="search-box">

  <input
    id="phoneSearch"
    type="text"
    placeholder="Search: USA, WhatsApp..."/>

</div>



<!-- ================= COUNTRIES ================= -->

<div
  id="phoneCountryRow"
  class="country-row">
</div>



<!-- ================= ACTIVE ORDER ================= -->

<section
  id="activeOrder"
  class="active-card hidden"
  style="display:none">

  <div
    id="orderService"
    style="font-weight:700">
  </div>


  <div
    id="phoneNumber"
    style="font-size:15px;margin:12px 0;color:#fff">
  </div>


  <div
    id="otpBox"
    class="hidden"
    style="display:none;margin-top:12px;background:#000;border:1px solid #00C896;padding:12px;border-radius:10px">

    <div>

      <div
        style="font-size:10px;color:#888">

        OTP CODE

      </div>

      <strong
        id="otpCode"
        style="font-size:22px">

    </div>


    <span
      id="copyBtn"
      style="display:inline-block;margin-top:10px;background:#00C896;color:#000;padding:8px 16px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer">

      COPY

    </span>

  </div>

</section>



<!-- ================= SERVICES ================= -->

<h2
style="padding:12px 12px 0;font-size:12px;color:#666">

  POPULAR SERVICES

</h2>


<section
id="services"
class="services-grid">
</section>


</main>



<!-- ================= TOPUP MODAL ================= -->

<div
id="topupModal"
class="hidden"
style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;align-items:end;justify-content:center">

  <div

    </h3>


    <input

    <input

      </button>

      <button

        style="padding:10px;background:#1a1a1a;color:#fff;border-radius:10px;border:1px solid #333">
        ₦1k
      </button>

      <button
        onclick="document.getElementById('customAmount').value=2000"
        style="padding:10px;background:#1a1a1a;color:#fff;border-radius:10px;border:1px solid #333">
        ₦2k
      </button>

      <button
        onclick="document.getElementById('customAmount').value=5000"
        style="padding:10px;background:#1a1a1a;color:#fff;border-radius:10px;border:1px solid #333">
        ₦5k
      </button>

    </div>


    <button

    <p

    </p>


    <button
      id="closeModalBtn"
      style="width:100%;padding:12px;background:#222;color:#fff;border:none;border-radius:10px;margin-top:10px">

      Close

    </button>

  </div>

</div>

</div>



<!-- ================= MAIN JAVASCRIPT ================= -->

<script>

const BACKEND =
"https://otp-backend-amwc.onrender.com";


// ===============================
// COUNTRIES
// ===============================

const countries = [
  "Nigeria",
  "USA",
  "UK",
  "Canada",
  "Germany",
  "France",
  "India",
  "South Africa",
  "Kenya",
  "Ghana",
  "USA Virtual",
  "Poland",
  "Indonesia",
  "Brazil",
  "Turkey",
  "Netherlands",
  "Spain",
  "Australia",
  "UAE"
];

let selectedCountry = "Nigeria";


// ===============================
// WALLET
// ===============================

let currentBalance = 0;


function updateWallet(balance){

  currentBalance =
    Number(balance) || 0;

  const wallet =
    document.getElementById("walletBtn");

  wallet.textContent =
    "₦" +
    currentBalance.toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );
}


// ===============================
// RENDER COUNTRIES
// ===============================

function renderCountries(filter = ""){

  const row =
    document.getElementById(
      "phoneCountryRow"
    );

  row.innerHTML =
    countries
      .filter(c =>
        c.toLowerCase()
          .includes(
            filter.toLowerCase()
          )
      )
      .map(c => `

        <div
          class="country-chip ${c === selectedCountry ? "active" : ""}"
          onclick="selectCountry('${c}')">

          ${c}

        </div>

      `)
      .join("");
}


window.selectCountry = function(country){

  selectedCountry =
    country;

  renderCountries();

  renderServices(
    document.getElementById(
      "phoneSearch"
    ).value
  );
};


renderCountries();


// ===============================
// SERVICES
// ===============================

const servicesList = [

  {
    name:"WhatsApp",
    id:"whatsapp",
    price:"₦1,000",
    logo:"https://cdn.simpleicons.org/whatsapp/25D366"
  },

  {
    name:"Telegram",
    id:"telegram",
    price:"₦800",
    logo:"https://cdn.simpleicons.org/telegram/26A5E4"
  },

  {
    name:"Facebook",
    id:"facebook",
    price:"₦700",
    logo:"https://cdn.simpleicons.org/facebook/1877F2"
  },

  {
    name:"Google",
    id:"google",
    price:"₦900",
    logo:"https://cdn.simpleicons.org/google/EA4335"
  },

  {
    name:"Instagram",
    id:"instagram",
    price:"₦800",
    logo:"https://cdn.simpleicons.org/instagram/E4405F"
  },

  {
    name:"Twitter",
    id:"twitter",
    price:"₦700",
    logo:"https://cdn.simpleicons.org/x/ffffff"
  },

  {
    name:"Discord",
    id:"discord",
    price:"₦600",
    logo:"https://cdn.simpleicons.org/discord/5865F2"
  },

  {
    name:"TikTok",
    id:"tiktok",
    price:"₦700",
    logo:"https://cdn.simpleicons.org/tiktok/ffffff"
  },

  {
    name:"Apple",
    id:"apple",
    price:"₦1,200",
    logo:"https://cdn.simpleicons.org/apple/ffffff"
  },

  {
    name:"Microsoft",
    id:"microsoft",
    price:"₦900",
    logo:"https://cdn.simpleicons.org/microsoft/00A4EF"
  },

  {
    name:"Uber",
    id:"uber",
    price:"₦800",
    logo:"https://cdn.simpleicons.org/uber/000000"
  },

  {
    name:"Amazon",
    id:"amazon",
    price:"₦900",
    logo:"https://cdn.simpleicons.org/amazon/FF9900"
  }

];


function renderServices(filter = ""){

  const element =
    document.getElementById(
      "services"
    );

  element.innerHTML =
    servicesList
      .filter(s =>
        s.name
          .toLowerCase()
          .includes(
            filter.toLowerCase()
          )
      )
      .map(s => `

        <div
          class="service-card"
          onclick="buyService('${s.id}','${s.name}')">

          <div class="service-left">

            <div class="service-logo">

              <img
                src="${s.logo}"
                alt="${s.name}"/>

            </div>

            <div>

              <div class="service-name">
                ${s.name}
              </div>

              <div class="service-meta">
                ${selectedCountry} • ${s.price}
              </div>

            </div>

          </div>

          <button
            class="buy-btn"
            onclick="event.stopPropagation();buyService('${s.id}','${s.name}')">

            BUY

          </button>

        </div>

      `)
      .join("");
}


renderServices();


// ===============================
// SEARCH
// ===============================

document
  .getElementById("phoneSearch")
  .addEventListener(
    "input",
    event => {

      const value =
        event.target.value;

      renderCountries(value);

      renderServices(value);

    }
  );


// ===============================
// COPY OTP
// ===============================

document
  .getElementById("copyBtn")
  .onclick = () => {

    const code =
      document.getElementById(
        "otpCode"
      ).textContent;

    if(code){

      navigator.clipboard
        .writeText(code);

    }

  };


// ===============================
// LOAD BALANCE
// ===============================

async function loadBalance(){

  const email =
    document
      .getElementById(
        "userEmail"
      )
      .textContent
      .trim()
      .toLowerCase();

  if(!email) return;


  try{

    /*
      Firebase login does not automatically
      give our backend a JWT.

      So we use the sync endpoint.
    */

    const response =
      await fetch(
        BACKEND +
        "/api/firebase/sync",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email
          })
        }
      );


    const data =
      await response.json();


    if(
      data.success &&
      data.user
    ){

      const balance =
        data.user.balances?.nigeria || 0;

      updateWallet(
        balance
      );

      /*
        Save backend JWT for
        OTP purchase requests.
      */

      if(data.token){

        localStorage.setItem(
          "otphub_backend_token",
          data.token
        );

      }

    }

  }catch(error){

    console.error(
      "Balance error:",
      error
    );

  }

}


// ===============================
// BUY OTP
// ===============================

window.buyService =
async function(
  serviceId,
  serviceName
){

  const email =
    document
      .getElementById(
        "userEmail"
      )
      .textContent
      .trim()
      .toLowerCase();

  if(!email){

    alert(
      "Please login first"
    );

    return;
  }


  const token =
    localStorage.getItem(
      "otphub_backend_token"
    );


  if(!token){

    await loadBalance();

  }


  const finalToken =
    localStorage.getItem(
      "otphub_backend_token"
    );


  if(!finalToken){

    alert(
      "Unable to connect your account. Please logout and login again."
    );

    return;
  }


  const orderEl =
    document.getElementById(
      "activeOrder"
    );


  orderEl.style.display =
    "block";

  orderEl.classList.remove(
    "hidden"
  );


  document.getElementById(
    "orderService"
  ).textContent =
    serviceName +
    " • " +
    selectedCountry;


  document.getElementById(
    "phoneNumber"
  ).textContent =
    "Checking number...";


  document.getElementById(
    "otpBox"
  ).style.display =
    "none";


  document.getElementById(
    "otpBox"
  ).classList.add(
    "hidden"
  );


  orderEl.scrollIntoView({
    behavior:"smooth"
  });


  try{

    /*
      Convert frontend country
      names to backend country codes.
    */

    const countryMap = {

      "Nigeria":
        "nigeria",

      "USA":
        "usa",

      "UK":
        "uk",

      "Canada":
        "canada",

      "Germany":
        "germany",

      "France":
        "france",

      "India":
        "india",

      "South Africa":
        "southafrica",

      "Kenya":
        "kenya",

      "Ghana":
        "ghana",

      "Brazil":
        "brazil",

      "Spain":
        "spain",

      "Australia":
        "australia"

    };


    const countryCode =
      countryMap[
        selectedCountry
      ];


    if(!countryCode){

      document.getElementById(
        "phoneNumber"
      ).textContent =
        "Number is unavailable";

      return;
    }


    const response =
      await fetch(
        BACKEND +
        "/api/orders",
        {
          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              finalToken

          },

          body:JSON.stringify({

            country:
              countryCode,

            service:
              serviceId.toLowerCase()

          })
        }
      );


    const data =
      await response.json();


    if(!response.ok ||
       !data.success){

      document.getElementById(
        "phoneNumber"
      ).textContent =
        data.message ||
        "Number is unavailable";

      return;
    }


    const order =
      data.order;


    if(!order ||
       !order.phone){

      document.getElementById(
        "phoneNumber"
      ).textContent =
        "Number is unavailable";

      return;
    }


    document.getElementById(
      "phoneNumber"
    ).textContent =
      order.phone;


    /*
      Update wallet immediately
      after OTP purchase.
    */

    if(data.balances){

      updateWallet(
        data.balances.nigeria || 0
      );

    }


    /*
      Poll for OTP.
    */

    checkOTP(
      order.id,
      finalToken
    );


  }catch(error){

    console.error(error);

    document.getElementById(
      "phoneNumber"
    ).textContent =
      "Number is unavailable now. Check back later.";

  }

};


// ===============================
// CHECK OTP
// ===============================

async function checkOTP(
  orderId,
  token
){

  let attempts = 0;

  const maxAttempts =
    30;


  const interval =
    setInterval(
      async () => {

        attempts++;


        try{

          const response =
            await fetch(
              BACKEND +
              "/api/orders/" +
              encodeURIComponent(
                orderId
              ),
              {
                headers:{
                  "Authorization":
                    "Bearer " +
                    token
                }
              }
            );


          const data =
            await response.json();


          if(
            data.success &&
            data.order
          ){

            const order =
              data.order;


            if(order.otp){

              clearInterval(
                interval
              );


              document.getElementById(
                "otpCode"
              ).textContent =
                order.otp;


              document.getElementById(
                "otpBox"
              ).style.display =
                "block";


              document.getElementById(
                "otpBox"
              ).classList.remove(
                "hidden"
              );

            }

          }


        }catch(error){

          console.error(
            "OTP check error:",
            error
          );

        }


        if(
          attempts >=
          maxAttempts
        ){

          clearInterval(
            interval
          );

        }

      },
      10000
    );

}


// ===============================
// DEPOSIT MODAL
// ===============================

function openDeposit(){

  const modal =
    document.getElementById(
      "topupModal"
    );

  modal.style.display =
    "flex";

  modal.classList.remove(
    "hidden"
  );

}


document
  .getElementById(
    "depositBtn"
  )
  .onclick =
  openDeposit;


document
  .getElementById(
    "walletBtn"
  )
  .onclick =
  openDeposit;


document
  .getElementById(
    "closeModalBtn"
  )
  .onclick =
  () => {

    const modal =
      document.getElementById(
        "topupModal"
      );

    modal.style.display =
      "none";

    modal.classList.add(
      "hidden"
    );

  };


// ===============================
// PAYSTACK PAYMENT
// ===============================

document
  .getElementById(
    "payBtn"
  )
  .onclick =
  async () => {

    const amount =
      Number(
        document.getElementById(
          "customAmount"
        ).value
      );


    if(
      !amount ||
      amount < 100
    ){

      alert(
        "Minimum ₦100"
      );

      return;
    }


    const email =
      (
        document
          .getElementById(
            "payEmail"
          )
          .value
          .trim() ||

        document
          .getElementById(
            "userEmail"
          )
          .textContent
          .trim()
      ).toLowerCase();


    if(
      !email.includes("@")
    ){

      alert(
        "Enter a valid email"
      );

      return;
    }


    const status =
      document.getElementById(
        "payStatus"
      );


    status.textContent =
      "Initializing payment...";


    const button =
      document.getElementById(
        "payBtn"
      );


    button.disabled =
      true;


    try{

      const response =
        await fetch(
          BACKEND +
          "/api/pay/initialize",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              email:
                email,

              amount:
                amount

            })
          }
        );


      const data =
        await response.json();


      if(
        data.status &&
        data.data &&
        data.data.authorization_url
      ){

        status.textContent =
          "Redirecting to Paystack...";


        /*
          Paystack will return to:

          payment-success.html?trxref=...
        */

        window.location.href =
          data.data.authorization_url;

      }else{

        button.disabled =
          false;

        status.textContent =
          data.message ||
          "Unable to start payment";

      }

    }catch(error){

      console.error(error);

      button.disabled =
        false;

      status.textContent =
        "Payment connection failed";

    }

  };


// ===============================
// CHECK PAYMENT RETURN
// ===============================

async function checkPaymentReturn(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const reference =
    params.get(
      "reference"
    ) ||
    params.get(
      "trxref"
    );


  if(!reference) return;


  try{

    const response =
      await fetch(
        BACKEND +
        "/api/pay/verify?reference=" +
        encodeURIComponent(
          reference
        )
      );


    const data =
      await response.json();


    if(data.success){

      if(data.balances){

        updateWallet(
          data.balances.nigeria || 0
        );

      }else{

        await loadBalance();

      }

    }

  }catch(error){

    console.error(
      "Payment return error:",
      error
    );

  }

}


// ===============================
// PAGE LOAD
// ===============================

window.addEventListener(
  "load",
  () => {

    checkPaymentReturn();

  }
);

</script>

    if(user){

// ===============================
// FIREBASE → MONGODB
// ===============================

async function syncFirebaseUser(
  user
){

  try{

    const response =
      await fetch(
        "https://otp-backend-amwc.onrender.com/api/firebase/sync",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            email:
              user.email,

            name:
              user.displayName || "",

            picture:
              user.photoURL || ""

          })
        }
      );


    const data =
      await response.json();


    if(
      data.success &&
      data.token
    ){

      localStorage.setItem(
        "otphub_backend_token",
        data.token
      );

    }


    if(
      data.success &&
      data.user
    ){

      updateWallet(
        data.user.balances?.nigeria || 0
      );

    }


  }catch(error){

    console.error(
      "Firebase sync error:",
      error
    );

  }

}
