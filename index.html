<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OTPHub - 50 Countries</title>
<link rel="stylesheet" href="index.css"/>
<style>
.services-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.service-card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.service-card:hover{border-color:#00C896}
.country-row{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
.country-chip{white-space:nowrap;background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer}
.country-chip.active{background:#00C896;color:#000}
</style>
</head>
<body>
<div id="toasts" style="position:fixed;top:20px;right:20px;z-index:9999"></div>
<div id="authScreen" class="auth-screen">
<div class="auth-card">
<div class="logo">OTPHub.</div>
<p class="auth-sub">50 Countries • Local currency</p>
<div class="tabs">
<button id="tabLogin" class="tab active">Login</button>
<button id="tabRegister" class="tab">Create Account</button>
</div>
<form id="loginForm">
<input id="loginEmail" type="email" class="input" placeholder="Email" required/>
<input id="loginPass" type="password" class="input" placeholder="Password" required/>
<button type="submit" class="auth-btn">Login</button>
<p style="text-align:center;margin-top:12px"><button type="button" id="forgotBtn" style="background:none;border:none;color:#00C896;font-size:14px;cursor:pointer;text-decoration:underline">Forgot Password?</button></p>
</form>
<form id="registerForm" class="hidden">
<input id="regEmail" type="email" class="input" placeholder="Email" required/>
<input id="regPass" type="password" class="input" placeholder="Password min 6" required/>
<input id="regPass2" type="password" class="input" placeholder="Confirm" required/>
<button type="submit" class="auth-btn">Create Account</button>
</form>
</div>
</div>
<div id="app" class="hidden">
<header class="header"><div class="logo">OTPHub.</div><div class="header-right"><span id="userEmail" style="font-size:12px"></span><button id="walletBtn" class="wallet"><span id="walletBalance">₦0</span></button><button id="logoutBtn" class="logout">Logout</button></div></header>
<main>
<section class="hero"><div id="localBadge" class="local-badge">📍 Nigeria • ₦1,000</div><h1>Buy OTP for <span id="heroPrice">₦1,000</span></h1><p id="heroSub">50 countries available</p><div class="deposit-bar"><button id="depositBtn" class="deposit-btn">💳 Deposit / Fund Wallet</button></div></section>
<div class="search-box"><input id="phoneSearch" type="text" placeholder="Search: USA, WhatsApp..."/></div>
<div id="phoneCountryRow" class="country-row"></div>
<section id="activeOrder" class="active-card hidden" style="margin:12px;background:#1a1a1a;border-radius:12px;padding:12px"><div style="display:flex;justify-content:space-between"><span id="orderService"></span><span id="timer">15:00</span></div><div id="phoneNumber" style="font-weight:bold;margin:8px 0"></div><div id="otpBox" class="hidden" style="background:#000;padding:12px;border-radius:8px;display:flex;justify-content:space-between"><div><div style="font-size:10px;color:#aaa">OTP CODE</div><strong id="otpCode"></strong></div><span onclick="navigator.clipboard.writeText(document.getElementById('otpCode').textContent);alert('Copied')" style="background:#00C896;color:#000;padding:6px 12px;border-radius:20px;cursor:pointer">COPY</span></div><div id="waitingText">Waiting for SMS...</div></section>
<h2 style="padding:12px 12px 0">Services</h2>
<section id="services" class="services-grid"></section>
</main>
<div id="topupModal" class="modal hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;display:flex;align-items:end;justify-content:center"><div style="background:#111;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:500px"><h3>💳 Deposit</h3><input id="payEmail" type="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;border-radius:8px;background:#000;color:#fff;border:1px solid #333"/><input id="customAmount" type="number" placeholder="Amount e.g 1000" style="width:100%;padding:14px;border:2px solid #00C896;border-radius:8px;background:#000;color:#fff"/><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0"><button onclick="setAmount(500)" style="padding:10px;background:#1a1a1a;color:#fff;border-radius:8px">₦500</button><button onclick="setAmount(1000)" style="padding:10px;background:#1a1a1a;color:#fff;border-radius:8px">₦1k</button><button onclick="setAmount(2000)" style="padding:10px;background:#1a1a1a;color:#fff;border-radius:8px">₦2k</button><button onclick="setAmount(5000)" style="padding:10px;background:#1a1a1a;color:#fff;border-radius:8px">₦5k</button></div><button onclick="payCustom()" style="width:100%;padding:16px;background:#00C896;font-weight:bold;border:none;border-radius:8px">Pay Now</button><p id="payStatus" style="text-align:center;margin-top:10px"></p><button id="closeModalBtn" style="width:100%;padding:12px;background:#222;color:#fff;border:none;border-radius:8px;margin-top:8px">Close</button></div></div>
</div>
<script>
const countries=["Nigeria","USA","UK","Canada","Germany","France","India","South Africa","Kenya","Ghana","USA Virtual","UK Virtual","Poland","Indonesia","Brazil","Turkey","Netherlands","Spain","Australia","UAE","Pakistan","Bangladesh","Philippines","Mexico","Romania"];
let selectedCountry="Nigeria";
function renderCountries(filter=""){
  const row=document.getElementById('phoneCountryRow');
  if(!row) return;
  row.innerHTML=countries.filter(c=>c.toLowerCase().includes(filter.toLowerCase())).map(c=>`<div class="country-chip ${c===selectedCountry?'active':''}" onclick="selectCountry('${c}')">${c}</div>`).join('');
}
window.selectCountry=function(c){selectedCountry=c;renderCountries();document.getElementById('heroSub').textContent=c+" selected"};
renderCountries();
const servicesList=[
{name:"WhatsApp",icon:"💬",price:"₦1,000"},
{name:"Telegram",icon:"✈️",price:"₦800"},
{name:"Facebook",icon:"📘",price:"₦700"},
{name:"Google",icon:"🔍",price:"₦900"},
{name:"Instagram",icon:"📸",price:"₦800"},
{name:"Twitter/X",icon:"🐦",price:"₦700"},
{name:"Discord",icon:"🎮",price:"₦600"},
{name:"TikTok",icon:"🎵",price:"₦700"},
{name:"Apple",icon:"🍎",price:"₦1,200"},
{name:"Microsoft",icon:"🪟",price:"₦900"},
{name:"Uber",icon:"🚗",price:"₦800"},
{name:"Amazon",icon:"📦",price:"₦900"},
];
function renderServices(filter=""){
  const el=document.getElementById('services');
  if(!el) return;
  const f=servicesList.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase())||selectedCountry.toLowerCase().includes(filter.toLowerCase()));
  el.innerHTML=f.map(s=>`<div class="service-card" onclick="buyService('${s.name}')"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center">${s.icon}</div><div><div style="font-weight:600;font-size:14px">${s.name}</div><div style="font-size:11px;color:#aaa">${selectedCountry} • ${s.price}</div></div></div><button style="background:#00C896;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:12px">BUY</button></div>`).join('');
}
window.buyService=function(name){
  document.getElementById('orderService').textContent=name+" • "+selectedCountry;
  document.getElementById('phoneNumber').textContent="+1 (XXX) XXX-"+Math.floor(1000+Math.random()*9000);
  document.getElementById('activeOrder').classList.remove('hidden');
  document.getElementById('activeOrder').scrollIntoView({behavior:'smooth'});
  setTimeout(()=>{document.getElementById('otpCode').textContent=Math.floor(100000+Math.random()*900000);document.getElementById('otpBox').classList.remove('hidden');document.getElementById('waitingText').textContent="✅ OTP Received!";},4000);
}
renderServices();
document.getElementById('phoneSearch')?.addEventListener('input',e=>{renderCountries(e.target.value);renderServices(e.target.value);});
window.setAmount=function(v){document.getElementById('customAmount').value=v};
window.payCustom=function(){const a=document.getElementById('customAmount').value;if(!a||Number(a)<100)return alert("Min ₦100");payNow(Number(a))};
async function payNow(amount){
  const email=(document.getElementById('payEmail').value.trim()||document.getElementById('userEmail').textContent.trim());
  if(!email.includes('@')){alert("Enter valid email");return;}
  document.getElementById('payStatus').textContent="Redirecting...";
  try{
    const res=await fetch('https://otp-backend-amwc.onrender.com/api/pay/initialize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,amount})});
    const data=await res.json();
    if(data.status&&data.data.authorization_url){localStorage.setItem('pending_pay_ref',data.data.reference);window.location.href=data.data.authorization_url;}
    else{document.getElementById('payStatus').textContent="Error: "+JSON.stringify(data);}
  }catch(e){document.getElementById('payStatus').textContent="Network error: "+e.message;}
}
document.getElementById('depositBtn')?.addEventListener('click',()=>{const em=document.getElementById('userEmail').textContent;if(em)document.getElementById('payEmail').value=em;document.getElementById('topupModal').classList.remove('hidden');});
document.getElementById('walletBtn')?.addEventListener('click',()=>{const em=document.getElementById('userEmail').textContent;if(em)document.getElementById('payEmail').value=em;document.getElementById('topupModal').classList.remove('hidden');});
document.getElementById('closeModalBtn')?.addEventListener('click',()=>document.getElementById('topupModal').classList.add('hidden'));
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyB-Wgn8wwpPk5q5sITaHd2tN-GRQj-ZBW4",authDomain:"otphub-d1272.firebaseapp.com",projectId:"otphub-d1272",storageBucket:"otphub-d1272.firebasestorage.app",messagingSenderId:"516462339713",appId:"1:516462339713:web:04b6044c5bfc403cd4cf80"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);
function toast(m,t='ok'){const c=document.getElementById('toasts');const d=document.createElement('div');d.textContent=m;d.style.cssText=`padding:12px 18px;border-radius:8px;margin:8px;color:#fff;background:${t==='err'?'#e74c3c':'#00C896'}`;c.appendChild(d);setTimeout(()=>d.remove(),4000);}
document.getElementById('tabLogin').onclick=()=>{document.getElementById('tabLogin').classList.add('active');document.getElementById('tabRegister').classList.remove('active');document.getElementById('loginForm').classList.remove('hidden');document.getElementById('registerForm').classList.add('hidden');};
document.getElementById('tabRegister').onclick=()=>{document.getElementById('tabRegister').classList.add('active');document.getElementById('tabLogin').classList.remove('active');document.getElementById('registerForm').classList.remove('hidden');document.getElementById('loginForm').classList.add('hidden');};
onAuthStateChanged(auth,user=>{const a=document.getElementById('authScreen');const b=document.getElementById('app');const e=document.getElementById('userEmail');if(user){a.classList.add('hidden');b.classList.remove('hidden');e.textContent=user.email;}else{a.classList.remove('hidden');b.classList.add('hidden');}});
document.getElementById('registerForm').onsubmit=async(e)=>{e.preventDefault();const email=document.getElementById('regEmail').value.trim();const p=document.getElementById('regPass').value;const p2=document.getElementById('regPass2').value;if(p!==p2){toast("Passwords don't match",'err');return;}try{await createUserWithEmailAndPassword(auth,email,p);toast("Account created! Login now");document.getElementById('tabLogin').click();}catch(err){toast(err.message,'err');}};
document.getElementById('loginForm').onsubmit=async(e)=>{e.preventDefault();const email=document.getElementById('loginEmail').value.trim();const p=document.getElementById('loginPass').value;try{await signInWithEmailAndPassword(auth,email,p);toast("Login success");}catch(err){toast(err.message,'err');}};
document.getElementById('forgotBtn').onclick=async()=>{let email=document.getElementById('loginEmail').value.trim();if(!email)email=prompt("Enter email:");if(!email||!email.includes('@')){toast("Enter valid email",'err');return;}try{await sendPasswordResetEmail(auth,email);toast("✅ Reset sent! Check SPAM");}catch(err){toast(err.message,'err');}};
document.getElementById('logoutBtn').onclick=async()=>{await signOut(auth);toast("Logged out");};
</script>
</body>
</html>
