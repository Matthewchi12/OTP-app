<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTPHub - Local Currency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="toasts"></div>

  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="logo">OTPHub.</div>
      <p class="auth-sub">Login to buy numbers in your local currency</p>
      <div class="tabs"><button id="tabLogin" class="tab active">Login</button><button id="tabRegister" class="tab">Create Account</button></div>
      <form id="loginForm" class="auth-form"><input id="loginEmail" type="email" class="input" placeholder="Email" required /><input id="loginPass" type="password" class="input" placeholder="Password" required /><button type="submit" class="auth-btn">Login</button></form>
      <form id="registerForm" class="auth-form hidden"><input id="regEmail" type="email" class="input" placeholder="Email" required /><input id="regPass" type="password" class="input" placeholder="Password" required /><input id="regPass2" type="password" class="input" placeholder="Confirm" required /><button type="submit" class="auth-btn">Create Account</button></form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="header">
      <div class="logo">OTPHub.</div>
      <div class="header-right"><span id="userEmail" class="user-email"></span><button id="walletBtn" class="wallet"><span id="walletBalance">₦0</span></button><button id="logoutBtn" class="logout">Logout</button></div>
    </header>

    <main>
      <section class="hero">
        <div id="localBadge" class="local-badge">📍 Detecting your location...</div>
        <h1>Buy OTP for <span id="heroPrice">₦1,000</span></h1>
        <p id="heroSub">Price shown in your local currency • Phone numbers from any country</p>
      </section>

      <!-- SEARCH PHONE COUNTRY -->
      <div class="search-box">
        <input id="phoneSearch" type="text" placeholder="Search phone country: USA, UK, Canada, Nigeria..." />
      </div>

      <div id="phoneCountryRow" class="country-row"></div>

      <section id="activeOrder" class="active-card hidden">
        <div class="active-head"><span id="orderService"></span><span id="timer">15:00</span></div>
        <div class="timer-bar"><div id="timerProgress"></div></div>
        <div id="phoneNumber" class="phone"></div>
        <div id="orderStatus" class="status"></div>
        <div id="otpBox" class="otp-box hidden"><div><div class="otp-label">OTP CODE</div><strong id="otpCode"></strong></div><span class="copy-pill">COPY</span></div>
        <div id="waitingText" class="waiting"><span class="dot"></span> Waiting for SMS...</div>
      </section>

      <h2 id="servicesTitle"></h2>
      <section id="services"></section>
    </main>

    <div id="topupModal" class="modal hidden">
      <div class="modal-content"><div class="handle"></div><h3 id="modalCountry"></h3><p class="current">Balance: <strong id="modalBalance"></strong></p><div id="topupOptions"></div><button id="closeModalBtn" class="close-btn">Close</button></div>
    </div>
  </div>
  <script src=" index.js"></script>
</body>
</html>
